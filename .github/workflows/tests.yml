# Project-owned (customised from ARCDevTools workflows-spm/tests.yml; template header removed
# so arcdevtools-setup leaves it alone).
#
# The package is iOS-only, so `swift test` on the macOS host cannot build it. Tests run with
# xcodebuild on an iOS simulator, with a 100% line-coverage gate on the library targets.
# The job names `Build (macOS)` / `Build (Linux)` are kept because branch protection requires them.
name: Tests

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-platforms:
    name: Check Platform Support
    runs-on: ubuntu-latest
    outputs:
      supports-linux: ${{ steps.check.outputs.supports-linux }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Apple-only
        id: check
        run: |
          if grep -qE "^[[:space:]]*platforms:[[:space:]]*\[" Package.swift; then
            echo "supports-linux=false" >> $GITHUB_OUTPUT
          else
            echo "supports-linux=true" >> $GITHUB_OUTPUT
          fi

  test-macos:
    name: Build (macOS)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick an iOS simulator
        id: sim
        run: |
          UDID="$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid')"
          test -n "$UDID" && test "$UDID" != "null"
          echo "udid=$UDID" >> $GITHUB_OUTPUT

      # Build and boot first, then run the tests against the booted simulator. With a single
      # `xcodebuild test` step, timing-sensitive tests stalled intermittently on 3-core runners;
      # with this split, 12 of 12 runs passed. Why is not established: load stayed at 200-600
      # either way.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme ARCMetricsOTel-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -derivedDataPath .build/DerivedData \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot the simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Test with coverage
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -scheme ARCMetricsOTel-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -derivedDataPath .build/DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Coverage gate (100%)
        run: python3 scripts/check-coverage.py TestResults.xcresult 100 ARCMetricsOTel ARCMetricsOTelMocks

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  test-linux:
    name: Build (Linux)
    needs: check-platforms
    if: needs.check-platforms.outputs.supports-linux == 'true'
    runs-on: ubuntu-latest
    container:
      image: swift:6.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run tests
        run: swift test --parallel
