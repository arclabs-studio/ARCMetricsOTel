# Project-owned (customised from ARCDevTools workflows-spm/tests.yml; template header removed
# so arcdevtools-setup leaves it alone).
#
# The package is iOS-only, so `swift test` on the macOS host cannot build it. Tests run with
# xcodebuild on an iOS simulator, with a 100% line-coverage gate on the library targets.
# The job names `Build (macOS)` / `Build (Linux)` are kept because branch protection requires them.
name: Tests

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-platforms:
    name: Check Platform Support
    runs-on: ubuntu-latest
    outputs:
      supports-linux: ${{ steps.check.outputs.supports-linux }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Apple-only
        id: check
        run: |
          if grep -qE "^[[:space:]]*platforms:[[:space:]]*\[" Package.swift; then
            echo "supports-linux=false" >> $GITHUB_OUTPUT
          else
            echo "supports-linux=true" >> $GITHUB_OUTPUT
          fi

  test-macos:
    name: Build (macOS)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick an iOS simulator
        id: sim
        run: |
          UDID="$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid')"
          test -n "$UDID" && test "$UDID" != "null"
          echo "udid=$UDID" >> $GITHUB_OUTPUT

      # TEMPORARY (FVRS-348): some runs stall for minutes. Record host memory, swap and the
      # heaviest processes every 15 s while xcodebuild runs, to test the memory-pressure theory.
      # Remove once the cause is fixed.
      - name: Start runner monitor
        run: |
          mkdir -p stall-samples
          nohup bash -c '
            sleep 20
            while pgrep -x xcodebuild >/dev/null; do
              {
                echo "=== $(date -u +%H:%M:%S)"
                sysctl -n vm.swapusage
                memory_pressure -Q 2>/dev/null | tail -1
                vm_stat | grep -E "Pages (free|active|inactive|wired|compressed|occupied)|Swapins|Swapouts|Pageouts"
                sysctl -n vm.loadavg
                top -l 1 -o mem -n 12 -stats pid,command,cpu,mem,th 2>/dev/null | tail -13
                for pid in $(pgrep -x xctest); do
                  echo "xctest $pid threads=$(ps -M -p "$pid" | tail -n +2 | wc -l | tr -d " ") rss_kb=$(ps -o rss= -p "$pid")"
                done
              } >> stall-samples/runner.log 2>&1
              sleep 15
            done
          ' > stall-samples/watchdog.log 2>&1 &

      - name: Test with coverage
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme ARCMetricsOTel-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Coverage gate (100%)
        run: python3 scripts/check-coverage.py TestResults.xcresult 100 ARCMetricsOTel ARCMetricsOTelMocks

      - name: Upload stall samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stall-samples
          path: stall-samples
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  test-linux:
    name: Build (Linux)
    needs: check-platforms
    if: needs.check-platforms.outputs.supports-linux == 'true'
    runs-on: ubuntu-latest
    container:
      image: swift:6.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run tests
        run: swift test --parallel
